[project]
name = "ballot-measures-2026"
version = "2.0.0"
description = "2026 ballot measures dashboard: household and statewide effects of state tax and benefit measures on the November 3, 2026 ballot (CO, CA, WA, ND, SD)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Exact pin, mirrored as POLICYENGINE_US_PIN in ballot_calc/config.py,
    # scripts/modal_pipeline.py and scripts/modal_household_api.py
    # (tests/test_registry.py keeps them equal). It brings its own
    # spm-calculator (>=1.0) and pandas requirements.
    "policyengine-us==2.60.4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0",
    "modal>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: builds PolicyEngine simulations; run on Modal (scripts/modal_tests.py)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["ballot_calc"]
