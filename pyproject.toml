[project]
name = "co-initiative-195"
version = "1.0.0"
description = "Colorado Initiative 195 (Amendment 87) dashboard: graduated income tax calculator and data pipeline (six brackets replacing the 4.4% flat tax, effective TY2027)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Exact pin: first release containing PR #9431 (Colorado Initiative
    # 195 graduated income tax contributed reform). Mirrored as
    # POLICYENGINE_US_PIN in co_tax_calc/reforms.py,
    # scripts/modal_pipeline.py, and scripts/modal_district_pipeline.py.
    # Keep all four in sync.
    "policyengine-us==1.825.0",
    # policyengine-us 1.825.0 imports spm_calculator.geoadj, which was
    # removed in spm-calculator 1.0.0 -- unpinned installs now crash on
    # import. 0.3.1 is the last release with geoadj (matches uv.lock).
    "spm-calculator==0.3.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["co_tax_calc"]
